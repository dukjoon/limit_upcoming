<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Error Glow -->
    <linearGradient id="error-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d1418"/>
      <stop offset="100%" stop-color="#241215"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', Menlo, Monaco, Consolas, 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="560" fill="url(#bg-grad)" rx="16"/>
  <rect width="1198" height="558" x="1" y="1" fill="none" stroke="#30363d" stroke-width="1" rx="15"/>

  <!-- Top Title Banner -->
  <text x="600" y="44" text-anchor="middle" fill="#8b949e" class="font-sans" font-size="14" font-weight="600" letter-spacing="1.5">
    THE ALL-TOO-FAMILIAR WALL: AGENT QUOTA EXHAUSTION (429)
  </text>

  <!-- ================= LEFT PANEL: CODEX / CLAUDE CLI VERSION ================= -->
  <g transform="translate(40, 70)" filter="url(#shadow)">
    <!-- Terminal Window -->
    <rect width="540" height="440" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="540" height="38" rx="10" fill="#161b22"/>
    <path d="M 0 38 L 540 38" stroke="#30363d" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="56" cy="19" r="6" fill="#27c93f"/>

    <text x="270" y="24" text-anchor="middle" fill="#8b949e" class="font-mono" font-size="12">
      zsh — codex / claude-code cli
    </text>

    <!-- Terminal Content -->
    <g class="font-mono" font-size="12.5">
      <!-- Command prompt -->
      <text x="24" y="75" fill="#58a6ff">$ codex "refactor authentication service &amp; token rotators"</text>
      <text x="24" y="102" fill="#8b949e">● Agent initializing workspace (18 files tracked)...</text>
      <text x="24" y="126" fill="#3fb950">✔ [1/4] Modified src/auth/token.py (Staged)</text>
      <text x="24" y="150" fill="#3fb950">✔ [2/4] Created untracked src/auth/crypto.py (New)</text>
      <text x="24" y="174" fill="#e3b341">⟳ [3/4] Modifying src/routes/login.py (Halfway through...)</text>

      <!-- Error Box -->
      <g transform="translate(18, 198)">
        <rect width="504" height="156" rx="8" fill="url(#error-grad)" stroke="#f85149" stroke-width="1.2"/>
        
        <!-- Warning Icon -->
        <text x="18" y="32" font-size="18">⚠️</text>
        <text x="46" y="32" fill="#f85149" font-weight="700" font-size="13.5">
          API Error: Rate Limit Reached
        </text>
        
        <!-- Actual Error Message verbatim -->
        <text x="18" y="62" fill="#ff7b72" font-weight="600" font-size="12">
          You’ve hit your usage limit.
        </text>
        <text x="18" y="84" fill="#c9d1d9" font-size="11.5">
          Upgrade to Pro (<tspan fill="#58a6ff" text-decoration="underline">https://chatgpt.com/explore/pro</tspan>),
        </text>
        <text x="18" y="104" fill="#c9d1d9" font-size="11.5">
          visit <tspan fill="#58a6ff" text-decoration="underline">https://chatgpt.com/settings/usage</tspan> to purchase
        </text>
        <text x="18" y="124" fill="#c9d1d9" font-size="11.5">
          more credits or <tspan fill="#f0883e" font-weight="600">try again at 6:04 PM</tspan>.
        </text>
        <text x="18" y="144" fill="#8b949e" font-size="10.5">
          Resets in 153h23m41s (Weekly quota cap exhausted)
        </text>
      </g>

      <!-- Consequence alert -->
      <text x="24" y="385" fill="#f85149" font-weight="600">✖ Process terminated: Exit Code 429</text>
      <text x="24" y="407" fill="#8b949e" font-size="11.5">Working tree left broken: 1 file half-edited, 1 untracked file lost.</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: DESKTOP APP / WEB MODAL VERSION ================= -->
  <g transform="translate(620, 70)" filter="url(#shadow)">
    <!-- Desktop Modal Window -->
    <rect width="540" height="440" rx="10" fill="url(#card-grad)" stroke="#30363d" stroke-width="1"/>
    
    <!-- Titlebar -->
    <rect width="540" height="38" rx="10" fill="#161b22"/>
    <path d="M 0 38 L 540 38" stroke="#30363d" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="38" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="56" cy="19" r="6" fill="#27c93f"/>

    <text x="270" y="24" text-anchor="middle" fill="#8b949e" class="font-sans" font-size="12" font-weight="500">
      ChatGPT / Claude Desktop App
    </text>

    <!-- Modal Content -->
    <g class="font-sans" text-anchor="middle" transform="translate(270, 60)">
      <!-- Warning Emblem -->
      <circle cx="0" cy="40" r="26" fill="#382414" stroke="#d29922" stroke-width="1.5"/>
      <text x="0" y="48" font-size="24">⏳</text>

      <!-- Headline -->
      <text x="0" y="100" fill="#f0f6fc" font-size="19" font-weight="700">
        You've hit your usage limit
      </text>

      <!-- Subtitle & Context -->
      <text x="0" y="130" fill="#8b949e" font-size="13">
        Responses are paused while quota resets.
      </text>

      <!-- Usage Progress Card -->
      <g transform="translate(-210, 150)">
        <rect width="420" height="96" rx="8" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
        <text x="16" y="28" fill="#c9d1d9" font-size="12" font-weight="600" text-anchor="start">
          Rolling Session Quota
        </text>
        <text x="404" y="28" fill="#f85149" font-size="12" font-weight="700" text-anchor="end">
          100% Used (Capped)
        </text>

        <!-- Progress Bar (100% Full) -->
        <rect x="16" y="42" width="388" height="8" rx="4" fill="#30363d"/>
        <rect x="16" y="42" width="388" height="8" rx="4" fill="#f85149"/>

        <text x="16" y="74" fill="#8b949e" font-size="11.5" text-anchor="start">
          Primary 5-hour limit: <tspan fill="#f0883e">Try again at 6:04 PM</tspan>
        </text>
        <text x="404" y="74" fill="#8b949e" font-size="11.5" text-anchor="end">
          Weekly: 98%
        </text>
      </g>

      <!-- Action Buttons -->
      <g transform="translate(0, 276)">
        <!-- Primary Action -->
        <g transform="translate(-210, 0)">
          <rect width="200" height="42" rx="6" fill="url(#btn-grad)"/>
          <text x="100" y="26" fill="#ffffff" font-size="13" font-weight="600">
            Upgrade to Pro ↗
          </text>
        </g>
        
        <!-- Secondary Action -->
        <g transform="translate(10, 0)">
          <rect width="200" height="42" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
          <text x="100" y="26" fill="#c9d1d9" font-size="13" font-weight="600">
            View Settings / Usage
          </text>
        </g>
      </g>

      <!-- Bottom Hint -->
      <g transform="translate(-210, 340)">
        <rect width="420" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-dasharray="3 3"/>
        <text x="210" y="27" fill="#8b949e" font-size="11.5">
          💡 Without <tspan fill="#58a6ff" font-weight="600">limit-upcoming</tspan>, in-flight edits are stuck here.
        </text>
      </g>
    </g>
  </g>
</svg>
